# Low BCrypt cost so Hegel properties that drive the real application through HTTP
# (many register/login iterations per run) stay fast. Production keeps BCrypt's default 10.
app.password.bcrypt-strength=4
# The concurrent registration property makes H2 reject hundreds of inserts per run on purpose
# (the unique constraint on users.email is the guarantee under test). Hibernate logs each one
# at WARN; keep that expected noise out of the test output.
logging.level.org.hibernate.orm.jdbc.error=ERROR
